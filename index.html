<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics you can use on Monday's eval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* Layout idea: a lab notebook. One narrow working column, one card per idea, charts and code as the main objects. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#131a2b; --muted:#56607a; --line:#d4d9e6;
  --accent:#2f4bd8; --accent-ink:#ffffff; --accent-soft:#e6eafc;
  --pass:#0c8474; --fail:#cf5a22; --code-bg:#eef1f8; --hl:#fff0b8;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1220; --surface:#161c2e; --ink:#e7ebf6; --muted:#9ba6c1; --line:#2b3451;
    --accent:#93a5ff; --accent-ink:#0d1220; --accent-soft:#222b4d;
    --pass:#3fc7b3; --fail:#f28d58; --code-bg:#10162a; --hl:#4d4212;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1220; --surface:#161c2e; --ink:#e7ebf6; --muted:#9ba6c1; --line:#2b3451;
  --accent:#93a5ff; --accent-ink:#0d1220; --accent-soft:#222b4d;
  --pass:#3fc7b3; --fail:#f28d58; --code-bg:#10162a; --hl:#4d4212;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:700}
h2{font-size:clamp(1.3rem,3.6vw,1.6rem);font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:20px}
.wrap.wide{max-width:980px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.brand{font:700 1.05rem var(--display);color:var(--ink);text-decoration:none;margin-right:auto}
.brand span{color:var(--accent)}
.top nav{display:flex;gap:14px;font-size:.92rem}
.stat{font:500 .85rem var(--mono);color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font:500 .78rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch}
.prose{max-width:65ch;display:flex;flex-direction:column;gap:12px}
dfn{font-style:normal;font-weight:600;border-bottom:2px dotted var(--accent)}
.note{background:var(--accent-soft);border-radius:8px;padding:12px 14px;max-width:65ch}
.caption{font-size:.9rem;color:var(--muted);max-width:65ch}
.caption b{color:var(--ink)}

/* course map */
.track{display:flex;flex-direction:column;gap:10px}
.track-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.track-head p{color:var(--muted);font-size:.92rem}
.lessons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lesson-tile{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:6px;height:100%;color:inherit;text-decoration:none}
.lesson-tile .num{font:500 .78rem var(--mono);color:var(--muted)}
.lesson-tile .q{font-size:.88rem;color:var(--muted)}
.lesson-tile.locked{background:transparent;border-style:dashed}
.lesson-tile.locked h3{color:var(--muted)}
a.lesson-tile{border:2px solid var(--accent)}
a.lesson-tile:hover{background:var(--accent-soft)}
.pill{align-self:flex-start;font:500 .72rem var(--mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.done{background:var(--pass);border-color:var(--pass);color:var(--surface)}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* lesson shell */
.parts{list-style:none;display:flex;gap:6px;margin:0;padding:0}
.parts li{flex:1;display:flex;flex-direction:column;gap:4px;font:500 .7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.parts .segs{display:flex;gap:3px}
.parts .segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.parts .segs i.seen{background:var(--accent);opacity:.45}
.parts .segs i.now{background:var(--accent)}
.parts li.on{color:var(--ink)}
@media (max-width:480px){.parts li span{font-size:.6rem}}
.stepnav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepnav .count{font:500 .85rem var(--mono);color:var(--muted)}

/* choices */
.choices{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0}
.choices legend{padding:0;margin-bottom:10px;font-weight:600;max-width:62ch}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 .8rem var(--mono)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--pass)} .choice.right .mark{background:var(--pass);border-color:var(--pass);color:var(--surface)}
.choice.wrong{border-color:var(--fail)} .choice.wrong .mark{background:var(--fail);border-color:var(--fail);color:var(--surface)}
.choice code{font-size:.88rem}
.feedback{border-left:4px solid var(--line);padding:8px 14px;max-width:65ch}
.feedback.good{border-color:var(--pass)} .feedback.bad{border-color:var(--fail)}
.feedback strong.good{color:var(--pass)} .feedback strong.bad{color:var(--fail)}
.xp{font:500 .8rem var(--mono);color:var(--accent);margin-left:6px;white-space:nowrap}

/* play */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.slider{display:flex;flex-direction:column;gap:2px;flex:1 1 220px}
.slider label{font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.slider output{font:500 .9rem var(--mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0}
.readouts div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.readouts dt{font-size:.78rem;color:var(--muted)}
.readouts dd{margin:0;font:500 1.1rem var(--mono);font-variant-numeric:tabular-nums}
.grid20{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:440px}
.cell{aspect-ratio:1;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;font:600 1rem var(--mono);color:var(--surface)}
.cell.p{background:var(--pass);border:0} .cell.f{background:var(--fail);border:0}
.bigscore{font:700 2.4rem var(--display);font-variant-numeric:tabular-nums;line-height:1}
.bigscore small{font:400 .9rem var(--body);color:var(--muted);margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{font:500 .85rem var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.chip.new{border-color:var(--accent);background:var(--accent-soft)}
.chart{width:100%;height:auto;display:block}
.chart text{font:400 12px var(--body);fill:var(--muted)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .bar{fill:var(--accent)}
.chart .truth{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 4}
.chart .truthlabel{fill:var(--ink);font-weight:600}
.chart .band{fill:var(--accent);opacity:.1}
.chart .run{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.55}
.chart .run.latest{stroke:var(--accent);stroke-width:2.2;opacity:1}
.chart .dot{fill:var(--accent)}
.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%,60%{box-shadow:0 0 0 6px var(--hl);background-color:var(--hl)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--accent)}}

/* code */
pre,code,textarea.code{font-family:var(--mono);font-size:.86rem}
pre{margin:0;background:var(--code-bg);border-radius:8px;padding:12px 14px;overflow-x:auto;line-height:1.5}
:not(pre)>code{background:var(--code-bg);padding:1px 5px;border-radius:4px}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);border-bottom:0;background:transparent;border-radius:8px 8px 0 0;padding:6px 14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--code-bg);color:var(--ink);font-weight:600}
.cellbox{display:flex;flex-direction:column;gap:10px}
textarea.code{width:100%;background:var(--code-bg);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:12px 14px;line-height:1.5;resize:vertical;white-space:pre;overflow:auto;tab-size:4}
.out{min-height:48px;white-space:pre-wrap;border:1px solid var(--line);background:transparent}
.out.err{border-color:var(--fail)}
.status{font-size:.88rem;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font:400 .84rem var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}

/* recap */
.formula{font:500 1.25rem var(--mono);background:var(--code-bg);border-radius:8px;padding:16px;overflow-x:auto;white-space:nowrap}
.sym{font:inherit;border:0;border-bottom:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;padding:0 2px}
.symlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.symlist li{display:flex;gap:10px;align-items:baseline}
.symlist .sym{font:500 1.05rem var(--mono);flex:none;min-width:2.4em;text-align:left}
ul.take{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:0}
.glossary div{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.glossary dt{font:600 1.02rem var(--display)}
.glossary dd{margin:0;font-size:.93rem}
.glossary a{font-size:.85rem}

/* --- additions for the full course --- */
.btn.lang{font-family:var(--mono);font-size:.8rem}
.track-head .meter{flex:1 1 120px;max-width:220px;align-self:center}
select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
select{max-width:100%}
.field{min-width:0;max-width:100%;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.chart .b2{fill:var(--pass)} .chart .b3{fill:var(--fail)} .chart .b4{fill:var(--muted);opacity:.45}
.chart .ghost{fill:none;stroke:var(--ink);stroke-width:1.5}
.chart .l1{fill:none;stroke:var(--accent);stroke-width:2.2} .chart .l2{fill:none;stroke:var(--pass);stroke-width:2.2} .chart .l3{fill:none;stroke:var(--fail);stroke-width:2.2}
.chart .l4{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.chart .a1{fill:var(--accent);opacity:.18} .chart .a2{fill:var(--pass);opacity:.18} .chart .a3{fill:var(--fail);opacity:.22}
.chart .d1{fill:var(--accent)} .chart .d2{fill:var(--pass)} .chart .d3{fill:var(--fail)} .chart .d4{fill:var(--muted)}
.chart .v1{stroke:var(--accent);stroke-width:2} .chart .v2{stroke:var(--pass);stroke-width:2} .chart .v3{stroke:var(--fail);stroke-width:2}
.chart .lab1{fill:var(--accent);font-weight:600} .chart .lab2{fill:var(--pass);font-weight:600} .chart .lab3{fill:var(--fail);font-weight:600} .chart .labk{fill:var(--ink);font-weight:600}
.chart.drag{touch-action:none;cursor:ew-resize} .chart.dragy{touch-action:none;cursor:ns-resize} .chart.dragxy{touch-action:none;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.k1{background:var(--accent)} .k2{background:var(--pass)} .k3{background:var(--fail)} .k4{background:var(--muted);opacity:.45}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.gridN{display:grid;gap:4px}
.gridN .cell{font-size:.75rem;border-radius:4px}
.cm{border-collapse:separate;border-spacing:4px;width:auto;font-family:var(--body);font-size:.9rem}
.cm th,.cm td{border:0;padding:8px 10px;white-space:normal;text-align:center}
.cm td{border-radius:8px;border:1px solid var(--line);min-width:92px}
.cm td b{display:block;font:500 1.2rem var(--mono)}
.cm td.good{border-color:var(--pass)} .cm td.bad{border-color:var(--fail)}
.bigstat{font:700 2rem var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.bigstat small{display:block;font:400 .9rem var(--body);color:var(--muted);margin-top:4px}
.codeline{font:500 .88rem var(--mono);background:var(--code-bg);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.claim{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.claim blockquote{margin:0;padding-left:12px;border-left:3px solid var(--accent);font-style:italic}
.claim .facts{font:400 .85rem var(--mono);color:var(--muted)}
textarea.notes{width:100%;min-height:150px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}
details summary{cursor:pointer;color:var(--accent)}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice>span:last-child{min-width:0;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="engine.js"></script>
<script src="widgets.js"></script>
<script src="widgets2.js"></script>
<script src="lessons-basic.js"></script>
<script src="lessons-inter.js"></script>
<script src="lessons-adv.js"></script>
<script>boot();</script>
</body>
</html>
